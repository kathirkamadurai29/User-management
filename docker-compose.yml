services:
  # MongoDB Database Service for Users and Request Activity Logs
  mongodb:
    image: mongo:7.0
    container_name: tenant_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tenant_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express / FastAPI REST API Service (Serves both React Frontend and REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenant_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_change_me_32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-user_platform}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tenant_network

  # React + Vite + Tailwind Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tenant_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tenant_network

volumes:
  mongo_data:
    driver: local

networks:
  tenant_network:
    driver: bridge
