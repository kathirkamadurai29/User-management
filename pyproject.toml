[project]
name = "user-management-platform"
version = "1.0.0"
description = "Multi-Tenant User Management Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "pymongo>=4.8.0",
    "supabase>=2.7.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
